name: Deploy naar Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "production"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Production only ever deploys master -- staging exists precisely so unreviewed
    # branches get tested before they reach real customers. Dispatching this workflow
    # against any other ref skips the job instead of deploying it.
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          MIJNHOST_BUILD: 'true'
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_MAIL_ENDPOINT_URL: ${{ vars.NEXT_PUBLIC_MAIL_ENDPOINT_URL }}
          NEXT_PUBLIC_MAIL_SECRET: ${{ secrets.NEXT_PUBLIC_MAIL_SECRET }}
          NEXT_PUBLIC_UPLOAD_ENDPOINT_URL: ${{ vars.NEXT_PUBLIC_UPLOAD_ENDPOINT_URL }}

      - name: Upload to glassartanddesign.com via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ vars.PRODUCTION_FTP_HOST }}
          username: ${{ secrets.PRODUCTION_FTP_USERNAME }}
          password: ${{ secrets.PRODUCTION_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          server-dir: ./
          # No dangerous-clean-slate here, unlike staging: this FTP account's directory
          # also holds mail-server/ and upload-server/ (PHP, not part of the Next.js build
          # output) -- wiping the remote dir first would delete those. Relying on the
          # action's default incremental sync (its own state file) instead, plus these
          # excludes as a second layer of protection.
          exclude: |
            **/mail-server/**
            **/upload-server/**

      - name: Smoke check
        run: |
          attempt=1
          max_attempts=3
          status=""
          while [ "$attempt" -le "$max_attempts" ]; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "https://glassartanddesign.com/nl/")
            if [ "$status" = "200" ]; then
              break
            fi
            echo "Attempt $attempt/$max_attempts: production did not respond with 200 (got $status)"
            attempt=$((attempt + 1))
            if [ "$attempt" -le "$max_attempts" ]; then
              sleep 5
            fi
          done
          if [ "$status" != "200" ]; then
            echo "Production did not respond with 200 after $max_attempts attempts (last status: $status)"
            exit 1
          fi

          gate_body=$(curl -s "https://glassartanddesign.com/nl/collecties/")
          if ! echo "$gate_body" | grep -q "We zijn met iets moois bezig"; then
            echo "::error::Under Construction-gate lijkt niet actief op /nl/collecties/ -- controleer of MIJNHOST_BUILD=true echt is meegegeven aan de build."
            exit 1
          fi
