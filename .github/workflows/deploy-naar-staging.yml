name: Deploy naar Staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "staging"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (server mode)
        run: npm run build
        env:
          NEXT_PUBLIC_ENVIRONMENT_LABEL: 'staging'
          NEXT_PUBLIC_MAIL_ENDPOINT_URL: ${{ vars.NEXT_PUBLIC_MAIL_ENDPOINT_URL }}
          NEXT_PUBLIC_MAIL_SECRET: ${{ secrets.NEXT_PUBLIC_MAIL_SECRET }}
          NEXT_PUBLIC_UPLOAD_ENDPOINT_URL: ${{ vars.NEXT_PUBLIC_UPLOAD_ENDPOINT_URL }}
          NEXT_PUBLIC_UPLOAD_SECRET: ${{ secrets.NEXT_PUBLIC_UPLOAD_SECRET }}
        # No MIJNHOST_BUILD here: staging stays fully open (no Under Construction gate),
        # unlike production. DB_HOST/PORT/USER/PASSWORD/NAME and
        # MAIL_SERVER_RESET_ENDPOINT_URL are runtime-only (read by getPool() and
        # sendResetEmail() at request time, not baked in at build time) and are already
        # set directly in the Node.js app's DirectAdmin environment-variables panel --
        # this workflow doesn't need to touch them.

      - name: Strip devDependencies from node_modules
        run: npm prune --omit=dev
        # next start (via app.js) only needs "dependencies" (mysql2, next, next-intl,
        # react, react-dom). Uploading a pruned node_modules alongside the build lets
        # the Node.js app run immediately after this deploy, without a manual "Run NPM
        # Install" click in DirectAdmin (that button has failed transiently before on a
        # large install right after an extract -- see the migration plan's Task 25).

      - name: Assemble deploy payload
        run: |
          rm -rf deploy_payload restart_trigger
          mkdir deploy_payload restart_trigger
          cp -r .next public messages src node_modules deploy_payload/
          rm -rf deploy_payload/.next/cache
          cp app.js next.config.mjs package.json package-lock.json deploy_payload/
          date -u > restart_trigger/restart.txt

      - name: Upload build to staging Node.js app via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ vars.STAGING_FTP_HOST }}
          port: 22
          username: ${{ secrets.STAGING_FTP_USERNAME }}
          password: ${{ secrets.STAGING_FTP_PASSWORD }}
          sftp_only: true
          # Plain FTP/FTPS to this host fails after tens of minutes with "425 Unable to
          # build data connection" -- reproduced identically from a local session and
          # from GitHub Actions, so it's a server-side passive-mode/data-channel problem,
          # not fixable client-side. SFTP tunnels everything over the one already-open
          # connection (confirmed listening: `h64.mijn.host:22` answers with
          # "SSH-2.0-mod_sftp") and has no separate data-channel step to fail.
          #
          # remote_path "/" (this account's own SFTP root) failed with "No such file" for
          # every top-level folder (messages, node_modules, public, src) -- the
          # DirectAdmin "Custom Directory" setting saved for the FTP protocol apparently
          # doesn't apply to mod_sftp, which roots SFTP sessions one level higher instead
          # (domains/staging.glassartanddesign.com/, sibling of public_html and
          # glassartanddesign.com). Pointing remote_path at that sibling folder directly.
          local_path: './deploy_payload/*'
          remote_path: '/glassartanddesign.com'
        # sftp_only skips remote directory auto-creation for remote_path itself (must
        # already exist, which it does), but nested folders inside an uploaded directory
        # are still created via SFTP's own MKDIR, no shell needed. No delete_remote_files:
        # this only PUTs files that exist locally, it never removes anything not in
        # deploy_payload/ -- tmp/ and stderr.log (Node.js Selector/Passenger-managed)
        # are left alone by construction, no explicit exclude needed like FTP required.

      - name: Trigger restart (tmp/restart.txt touch, standard Passenger convention)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ vars.STAGING_FTP_HOST }}
          port: 22
          username: ${{ secrets.STAGING_FTP_USERNAME }}
          password: ${{ secrets.STAGING_FTP_PASSWORD }}
          sftp_only: true
          local_path: './restart_trigger/*'
          remote_path: '/glassartanddesign.com/tmp'
        # Kept as a separate, narrowly-scoped upload (just this one file, into the
        # already-existing tmp/ folder) so it can't touch anything else in there. This is
        # a best-effort attempt, not a confirmed mechanism for this specific DirectAdmin
        # setup: if the Node.js Selector doesn't watch this file, the app keeps serving
        # the previous build until someone clicks "RESTART" on the Node.js app page in
        # DirectAdmin.

      - name: Smoke check
        env:
          BASIC_AUTH_PASSWORD: ${{ secrets.STAGING_BASIC_AUTH_PASSWORD }}
        run: |
          sleep 5
          attempt=1
          max_attempts=3
          status=""
          while [ "$attempt" -le "$max_attempts" ]; do
            status=$(curl -s -o /dev/null -w "%{http_code}" -u "glassart:$BASIC_AUTH_PASSWORD" "https://staging.glassartanddesign.com/nl/")
            if [ "$status" = "200" ]; then
              break
            fi
            echo "Attempt $attempt/$max_attempts: staging did not respond with 200 (got $status)"
            attempt=$((attempt + 1))
            if [ "$attempt" -le "$max_attempts" ]; then
              sleep 5
            fi
          done
          if [ "$status" != "200" ]; then
            echo "Staging did not respond with 200 after $max_attempts attempts (last status: $status)"
            exit 1
          fi
