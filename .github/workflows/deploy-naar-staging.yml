name: Deploy naar Staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "staging"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (server mode)
        run: npm run build
        env:
          NEXT_PUBLIC_ENVIRONMENT_LABEL: 'staging'
          NEXT_PUBLIC_MAIL_ENDPOINT_URL: ${{ vars.NEXT_PUBLIC_MAIL_ENDPOINT_URL }}
          NEXT_PUBLIC_MAIL_SECRET: ${{ secrets.NEXT_PUBLIC_MAIL_SECRET }}
          NEXT_PUBLIC_UPLOAD_ENDPOINT_URL: ${{ vars.NEXT_PUBLIC_UPLOAD_ENDPOINT_URL }}
          NEXT_PUBLIC_UPLOAD_SECRET: ${{ secrets.NEXT_PUBLIC_UPLOAD_SECRET }}
        # No MIJNHOST_BUILD here: staging stays fully open (no Under Construction gate),
        # unlike production. DB_HOST/PORT/USER/PASSWORD/NAME and
        # MAIL_SERVER_RESET_ENDPOINT_URL are runtime-only (read by getPool() and
        # sendResetEmail() at request time, not baked in at build time) and are already
        # set directly in the Node.js app's DirectAdmin environment-variables panel --
        # this workflow doesn't need to touch them.

      - name: Strip devDependencies from node_modules
        run: npm prune --omit=dev
        # next start (via app.js) only needs "dependencies" (mysql2, next, next-intl,
        # react, react-dom). Uploading a pruned node_modules alongside the build lets
        # the Node.js app run immediately after this deploy, without a manual "Run NPM
        # Install" click in DirectAdmin (that button has failed transiently before on a
        # large install right after an extract -- see the migration plan's Task 25).

      - name: Assemble deploy payload
        run: |
          rm -rf deploy_payload restart_trigger
          mkdir deploy_payload restart_trigger
          cp -r .next public messages src node_modules deploy_payload/
          rm -rf deploy_payload/.next/cache
          cp app.js next.config.mjs package.json package-lock.json deploy_payload/
          date -u > restart_trigger/restart.txt

      - name: Upload build to staging Node.js app via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ vars.STAGING_FTP_HOST }}
          username: ${{ secrets.STAGING_FTP_USERNAME }}
          password: ${{ secrets.STAGING_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./deploy_payload/
          # Node.js app's own Application root: a sibling of public_html under
          # domains/staging.glassartanddesign.com/, created by DirectAdmin's Node.js
          # Selector -- confirmed via File Manager to sit at this path, reachable by the
          # same FTP account already used for the old public_html deploy (its home
          # directory sits one level above both siblings, same pattern as
          # deploy-naar-production.yml's ./public_html/ target).
          server-dir: ./glassartanddesign.com/
          # No dangerous-clean-slate: this directory also holds tmp/ and stderr.log,
          # managed by the Node.js Selector/Passenger runtime, which must not be wiped.
          # Relying on the action's default incremental sync instead, plus these excludes
          # as a second layer of protection (same reasoning as production's workflow).
          exclude: |
            **/stderr.log
            **/tmp/**

      - name: Trigger restart (tmp/restart.txt touch, standard Passenger convention)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ vars.STAGING_FTP_HOST }}
          username: ${{ secrets.STAGING_FTP_USERNAME }}
          password: ${{ secrets.STAGING_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./restart_trigger/
          server-dir: ./glassartanddesign.com/tmp/
        # Kept as a separate, narrowly-scoped upload (just this one file) so it can't
        # touch anything else already inside the remote tmp/ folder. This is a best-effort
        # attempt, not a confirmed mechanism for this specific DirectAdmin setup: if the
        # Node.js Selector doesn't watch this file, the app keeps serving the previous
        # build until someone clicks "RESTART" on the Node.js app page in DirectAdmin.

      - name: Smoke check
        env:
          BASIC_AUTH_PASSWORD: ${{ secrets.STAGING_BASIC_AUTH_PASSWORD }}
        run: |
          sleep 5
          attempt=1
          max_attempts=3
          status=""
          while [ "$attempt" -le "$max_attempts" ]; do
            status=$(curl -s -o /dev/null -w "%{http_code}" -u "glassart:$BASIC_AUTH_PASSWORD" "https://staging.glassartanddesign.com/nl/")
            if [ "$status" = "200" ]; then
              break
            fi
            echo "Attempt $attempt/$max_attempts: staging did not respond with 200 (got $status)"
            attempt=$((attempt + 1))
            if [ "$attempt" -le "$max_attempts" ]; then
              sleep 5
            fi
          done
          if [ "$status" != "200" ]; then
            echo "Staging did not respond with 200 after $max_attempts attempts (last status: $status)"
            exit 1
          fi
